<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" aria-label="BPST Software Education Logo">
  <defs>
    <linearGradient id="bpstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF9000" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BPST Monogram Icon -->
  <g transform="translate(10, 12)">
    <!-- Diagonal Backing Arrow -->
    <path d="M 0,48 L 24,10 L 48,10 L 24,48 L 48,86 L 24,86 Z" fill="url(#bpstGrad)" />
    
    <!-- Stylized Modern 'B' Shape -->
    <path d="M 32,10 L 72,10 C 86,10 94,18 94,30 C 94,38 88,44 80,47 C 90,50 96,58 96,70 C 96,82 86,86 70,86 L 32,86 L 46,70 L 68,70 C 74,70 78,66 78,61 C 78,56 74,52 66,52 L 48,52 L 54,44 L 66,44 C 72,44 76,40 76,35 C 76,28 71,26 64,26 L 44,26 Z" fill="url(#bpstGrad)" />
    
    <!-- Tech Accent Dots / Energy Nodes -->
    <circle cx="24" cy="48" r="4.5" fill="#00F0FF" filter="url(#subtleGlow)" />
    <path d="M 68,14 L 76,6 L 84,14" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- BPST Main Brand -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" letter-spacing="1.5" fill="#0B1938">BPST</text>
    <text x="122" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="0.5" fill="#0066FF">Edu</text>
    
    <!-- Software Education -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="3" fill="#1E293B">SOFTWARE EDUCATION</text>
    
    <!-- Tagline Divider & Text -->
    <line x1="0" y1="72" x2="390" y2="72" stroke="#E2E8F0" stroke-width="1.5" />
    <line x1="0" y1="72" x2="90" y2="72" stroke="url(#bpstGrad)" stroke-width="2.5" />
    <text x="0" y="86" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" letter-spacing="0.8" fill="#64748B">BRIDGING THE GAP BETWEEN EDUCATION &amp; INDUSTRY</text>
  </g>
</svg>
