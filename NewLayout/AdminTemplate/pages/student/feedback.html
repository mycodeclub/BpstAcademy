<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feedback · BPST Academy Admin</title>
  <meta name="description" content="Feedback in the BPST Software Education admin panel prototype (demo data only).">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0062ff">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/img/icon-192.png">
  <script>try{var t=localStorage.getItem('bpst.theme');if(t)document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body data-root="../../" data-page="student.feedback" data-roles="student" data-title="Feedback">

<main id="main" class="content">
  <div class="page-head">
    <div>
      <h1>Feedback</h1>
      <p>A short survey after each module. The trainer sees averages only, never your name.</p>
    </div>
    
  </div>
  <form class="card" novalidate data-demo-form="Thank you. Your feedback is anonymous to the trainer and helps us improve."><div class="card-body d-grid gap-4">
      <div><span class="form-label d-block">How was Module 3 (React) with Arjun Mehta?</span><div class="btn-group flex-wrap" role="group" aria-label="Trainer rating"><input type="radio" class="btn-check" name="tr" id="tr1"><label class="btn btn-outline-secondary" for="tr1">1 ★</label><input type="radio" class="btn-check" name="tr" id="tr2"><label class="btn btn-outline-secondary" for="tr2">2 ★</label><input type="radio" class="btn-check" name="tr" id="tr3"><label class="btn btn-outline-secondary" for="tr3">3 ★</label><input type="radio" class="btn-check" name="tr" id="tr4"><label class="btn btn-outline-secondary" for="tr4">4 ★</label><input type="radio" class="btn-check" name="tr" id="tr5" checked><label class="btn btn-outline-secondary" for="tr5">5 ★</label></div></div>
      <div><span class="form-label d-block">How likely are you to recommend BPST Academy to a friend? (0–10)</span><div class="d-flex flex-wrap gap-1" role="group" aria-label="Recommend score"><input type="radio" class="btn-check" name="nps" id="n0"><label class="btn btn-outline-secondary btn-sm" for="n0" style="min-width:38px">0</label><input type="radio" class="btn-check" name="nps" id="n1"><label class="btn btn-outline-secondary btn-sm" for="n1" style="min-width:38px">1</label><input type="radio" class="btn-check" name="nps" id="n2"><label class="btn btn-outline-secondary btn-sm" for="n2" style="min-width:38px">2</label><input type="radio" class="btn-check" name="nps" id="n3"><label class="btn btn-outline-secondary btn-sm" for="n3" style="min-width:38px">3</label><input type="radio" class="btn-check" name="nps" id="n4"><label class="btn btn-outline-secondary btn-sm" for="n4" style="min-width:38px">4</label><input type="radio" class="btn-check" name="nps" id="n5"><label class="btn btn-outline-secondary btn-sm" for="n5" style="min-width:38px">5</label><input type="radio" class="btn-check" name="nps" id="n6"><label class="btn btn-outline-secondary btn-sm" for="n6" style="min-width:38px">6</label><input type="radio" class="btn-check" name="nps" id="n7"><label class="btn btn-outline-secondary btn-sm" for="n7" style="min-width:38px">7</label><input type="radio" class="btn-check" name="nps" id="n8"><label class="btn btn-outline-secondary btn-sm" for="n8" style="min-width:38px">8</label><input type="radio" class="btn-check" name="nps" id="n9" checked><label class="btn btn-outline-secondary btn-sm" for="n9" style="min-width:38px">9</label><input type="radio" class="btn-check" name="nps" id="n10"><label class="btn btn-outline-secondary btn-sm" for="n10" style="min-width:38px">10</label></div></div>
      <div class=""><label class="form-label" for="fbc">Anything we should improve?</label><textarea class="form-control" id="fbc" rows="3" placeholder="" ></textarea></div>
    </div><div class="card-footer d-flex justify-content-end"><button class="btn btn-primary" type="submit">Send feedback</button></div></form>

</main>

<script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/nav.js"></script>
<script src="../../assets/js/demo-data.js"></script>
<script src="../../assets/js/admin.js"></script>

</body>
</html>
